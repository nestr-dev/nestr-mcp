name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.0)'
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nestr-dev/nestr-mcp

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      # Anyone (or any app) with write access can push a v* tag on any commit,
      # and the tag alone publishes to npm, GHCR and the MCP Registry. v0.1.108
      # went out from a feature branch that way. Only publish commits that
      # reached main, which means they passed review and CI.
      - name: Verify the commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::$GITHUB_SHA is not on main. Release through ./release.sh so the bump is merged first."
            exit 1
          fi

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build
          path: build/

  publish-npm:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # Trusted Publishing (OIDC) requires npm CLI >= 11.5.1; Node 22 ships npm 10.x.
      # Without this, npm falls back to token auth and OIDC never engages.
      # Pin to the 11.x line: satisfies the >= 11.5.1 floor while avoiding a surprise
      # npm 12+ major (e.g. install-time default changes) breaking the job.
      - name: Update npm to 11.x
        run: npm install -g npm@11

      - name: Update package.json version
        run: npm version ${{ needs.build-and-test.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build
          path: build/

      # No NODE_AUTH_TOKEN: authentication is via OIDC Trusted Publishing.
      # Provenance is generated automatically when publishing this way.
      - name: Publish to npm
        run: npm publish --access public

  publish-mcp-registry:
    needs: [build-and-test, publish-npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Update server.json version
        run: |
          VERSION=${{ needs.build-and-test.outputs.version }}
          # release.sh commits server.json with the bump, so a mismatch here means
          # main drifted. Warn rather than fail so an old release can still publish.
          for field in .version '.packages[0].version'; do
            current=$(jq -r "$field" server.json)
            if [ "$current" != "$VERSION" ]; then
              echo "::warning file=server.json::server.json $field is $current but the release is $VERSION. Commit the bump with ./release.sh so main stays in sync."
            fi
          done
          # Update root version and package version in server.json
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.json.tmp
          mv server.json.tmp server.json
          cat server.json

      # Pinned and hash-checked because this binary runs with the registry
      # signing key. Dependabot can't see a curl download, so bump it by hand:
      # pick a release from https://github.com/modelcontextprotocol/registry/releases,
      # set the version, and copy just the hash from the mcp-publisher_linux_amd64.tar.gz
      # line of that release's registry_<version>_checksums.txt. The hash is
      # hardcoded rather than fetched because the registry's releases are not
      # immutable, so a checksums file from the same release proves nothing.
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: 1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          asset=mcp-publisher_linux_amd64.tar.gz
          curl -fsSL -o "$asset" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/${asset}"
          echo "${MCP_PUBLISHER_SHA256}  ${asset}" | sha256sum -c -
          tar xzf "$asset" mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Login to MCP Registry
        run: |
          mcp-publisher login dns \
            -algorithm ed25519 \
            -domain nestr.io \
            -private-key "${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}"

      # npm publish exiting 0 means npm accepted the tarball, not that the version
      # resolves. The MCP Registry validates a package by fetching it, and that
      # fetch 404s inside npm's propagation window: on v0.1.108 the check ran at
      # 16:32:35 and npm recorded the version as published at 16:33:22, 47
      # seconds later. v0.1.107 died on the same error a release earlier, and
      # because npm and GHCR both go green nobody was told, so the registry sat
      # two releases behind for nine days.
      #
      # `needs: publish-npm` cannot fix this. That dependency is already declared
      # and was satisfied; the race lives inside it. The only thing that helps is
      # waiting for the artifact the registry is about to look for.
      - name: Wait for npm to serve the version
        env:
          VERSION: ${{ needs.build-and-test.outputs.version }}
        run: |
          # No `curl -f`: a 404 is the expected answer while we wait, so it has
          # to come back as a value to loop on rather than a non-zero exit to
          # swallow. The scope is URL-encoded, which is the form the npm registry
          # documents for a scoped package.
          for i in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              "https://registry.npmjs.org/@nestr%2Fmcp/${VERSION}" || echo 000)
            if [ "$code" = "200" ]; then
              echo "npm is serving @nestr/mcp@${VERSION}"
              exit 0
            fi
            echo "attempt $i: npm answered ${code}; retrying in 10s"
            sleep 10
          done
          # Loud rather than skipped. A soft pass here is how the last two
          # releases went unregistered without anyone noticing.
          echo "::error::npm did not serve @nestr/mcp@${VERSION} within 5 minutes"
          exit 1

      - name: Publish to MCP Registry
        run: mcp-publisher publish

  publish-ghcr:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
